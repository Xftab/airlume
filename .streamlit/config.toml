[theme]
# Neumorphism: cream surface, ink-black text, burnt-orange accent (Nov 2026).
# Colours and radii live here; the soft shadows live in airlume/app/assets/airlume.css.
base = "light"
primaryColor = "#C2531B"
backgroundColor = "#F1E7D3"
secondaryBackgroundColor = "#E9DDC4"
textColor = "#1B1A17"
borderColor = "#CDBE9F"
linkColor = "#A8420F"
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = false
showSidebarBorder = false
dataframeHeaderBackgroundColor = "#E9DDC4"

[server]
headless = true
# Local development: listen on this laptop only. Streamlit Cloud overrides address/port itself.
address = "localhost"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# Viewers see the error type, not the traceback (which can reveal paths and internals).
# Full tracebacks still go to the terminal/log.
showErrorDetails = "type"
