[theme]
# Clean light theme (17 Nov 2026): cool white surfaces, navy ink, one blue accent.
# The accent is deliberately outside the AQI hue family (green to maroon), so a colour
# on screen means an air-quality band or it means "this is a control", never both.
# Colours live here; cards, the answer layout and the band colours live in
# airlume/app/assets/airlume.css.
base = "light"
primaryColor = "#2457C5"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1B2D"
borderColor = "#DCE3ED"
linkColor = "#1B3F94"
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
dataframeHeaderBackgroundColor = "#E8EEFB"

[server]
headless = true
# Local development: listen on this laptop only. Streamlit Cloud overrides address/port itself.
address = "localhost"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false

[client]
# Viewers see the error type, not the traceback (which can reveal paths and internals).
# Full tracebacks still go to the terminal/log.
showErrorDetails = "type"
