[theme]
base = "dark"
primaryColor = "#5BC8D6"
backgroundColor = "#0B0F14"
secondaryBackgroundColor = "#121922"
textColor = "#E8EEF4"

[server]
headless = true
# Local development: listen on this laptop only. Streamlit Cloud overrides address/port itself.
address = "localhost"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
