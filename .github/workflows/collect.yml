# Hourly collector. Lives at .github/workflows/collect.yml (moved there by hand;
# Claude's tools cannot write inside .github/workflows/).
#
# Twice an hour (:17 and :47) it fetches the EPA Punjab portal (Lahore stations, 36 districts,
# 7-day trend, 24-h forecast) and Open-Meteo CAMS, appends to data/archive/*.csv and
# commits. The CSVs are the project's data of record; the app rebuilds from them.
name: Collect hourly readings
on:
  schedule:
    # Two slots per hour: GitHub starts scheduled runs on a best-effort basis and
    # skipped four of the first five hourly slots on 14 Oct. The collector
    # de-duplicates, so a double catch within the hour is harmless.
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-collect.txt
      - run: pip install -r requirements-collect.txt
      - name: Collect
        env:
          AIRLUME_USE_FAKE_DATA: "0"
          AIRLUME_DB_PATH: /tmp/airlume.duckdb
        run: python scripts/collect_hourly.py
      - name: Commit the archive
        run: |
          git config user.name "airlume-collector"
          git config user.email "airlume-collector@users.noreply.github.com"
          git add data/archive
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: hourly collection $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X ours && git push && exit 0
            sleep 15
          done
          exit 1
