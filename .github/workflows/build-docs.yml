name: Check PDF build

# Verifies that both documents still build from their Markdown sources.
# It never commits anything: the PDFs in docs/pdf/ are rebuilt and saved
# by Claude in each working session. The built PDFs are attached to the
# run as a downloadable artifact, as a backup copy.
on:
  push:
    branches: [main]
    paths:
      - "docs/plan/**"
      - "docs/proposal-v1/**"
      - "docs/build.sh"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc, XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern xfonts-scalable fonts-dejavu-core fontconfig
          fc-cache -f

      - name: Build PDFs
        run: bash docs/build.sh

      - name: Attach PDFs to this run (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: airlume-pdfs
          path: docs/pdf/*.pdf
