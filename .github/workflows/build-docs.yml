name: Build PDFs

# Rebuilds the PDFs whenever a document source changes, and commits them back,
# so docs/pdf/ always matches docs/plan/ and docs/proposal-v1/.
on:
  push:
    branches: [main]
    paths:
      - "docs/plan/**"
      - "docs/proposal-v1/**"
      - "docs/build.sh"
      - ".github/workflows/build-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc, XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern xfonts-scalable fonts-dejavu-core fontconfig
          fc-cache -f

      - name: Build PDFs
        run: bash docs/build.sh

      - name: Commit updated PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf/
          if git diff --cached --quiet; then
            echo "PDFs already up to date."
          else
            git commit -m "docs: rebuild PDFs [automated]"
            git push
          fi
